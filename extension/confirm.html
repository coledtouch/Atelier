<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Confirm — Atelier Browser</title>
  <style>
    :root {
      --bg: #f6f2ea; --card: #fffdf8; --ink: #1d1b17; --muted: #6b655b; --line: #e3dccd;
      --accent: #8a4b1f; --accent-ink: #fff; --warn-bg: #fbeee2; --focus: #2f6fdb;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11100e; --card: #1b1916; --ink: #f1ece2; --muted: #a39b8e; --line: #34302a; --accent: #e0a36d; --accent-ink: #1b1209; --warn-bg: #2a2017; --focus: #7aa7ff; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    main { display: flex; flex-direction: column; gap: 14px; min-height: 100vh; padding: 18px 20px 16px; }
    .eyebrow { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 2px 0 0; font-size: 19px; line-height: 1.25; }
    .via { margin: 0; color: var(--muted); }
    dl { margin: 0; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; font: 12px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--muted); }
    .host { font-weight: 600; }
    .url, .sub { display: block; font-size: 12px; color: var(--muted); max-height: 3.2em; overflow: hidden; }
    .sub { margin-top: 2px; }
    .typed h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
    .typed pre { margin: 0; padding: 10px 12px; max-height: 120px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--warn-bg); border-radius: 8px; font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .typed p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
    .note { margin: 0; font-size: 12px; color: var(--muted); }
    /* Sticky, so Deny and Allow stay in view while a tall request opens at its top. */
    .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; position: sticky; bottom: 0; padding: 8px 0; background: var(--bg); }
    .timer { flex: 1; font-size: 12px; color: var(--muted); }
    button { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    button.allow { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button:disabled, button[aria-disabled="true"] { opacity: .45; cursor: default; }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div>
      <p class="eyebrow">Atelier Browser</p>
      <h1 id="title">Loading the request…</h1>
    </div>
    <p class="via" id="via"></p>
    <dl>
      <dt>Action</dt><dd id="action"></dd>
      <dt>Element</dt><dd><span id="label"></span><span class="tag" id="kind" hidden></span><span class="sub" id="near" hidden></span><span class="sub" id="href" hidden></span></dd>
      <dt>Page</dt><dd><span class="host" id="host"></span> <span id="pageTitle"></span><span class="url" id="url"></span></dd>
    </dl>
    <section class="typed" id="typed" hidden>
      <h2>Text to type</h2>
      <pre id="text"></pre>
      <p id="more" hidden></p>
    </section>
    <p class="note">Only allow this if you asked Atelier to do it. Nothing happens unless you choose Allow.</p>
    <div class="foot">
      <span class="timer" id="timer"></span>
      <button type="button" id="deny">Deny</button>
      <button type="button" class="allow" id="allow" aria-disabled="true">Allow</button>
    </div>
  </main>
  <script src="confirm.js"></script>
</body>
</html>
